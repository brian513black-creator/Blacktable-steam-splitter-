name: Windows installer
on:
  push:
    branches: [main, 'release/**']
    paths:
      - app.py
      - spleeter_engine.py
      - 'licenses/**'
      - 'web/**'
      - 'windows/**'
      - '.github/workflows/windows-installer.yml'
  pull_request:
    paths:
      - app.py
      - spleeter_engine.py
      - 'licenses/**'
      - 'web/**'
      - 'windows/**'
      - '.github/workflows/windows-installer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Linux cross-build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nsis
          python -m pip install ziglang==0.15.2
      - name: Cross-build the Windows installer
        run: python windows/build.py
      - name: Transfer the installer to the Windows test job
        uses: actions/upload-artifact@v4
        with:
          name: blacktable-windows-x64-candidate
          path: |
            dist/*-Setup.exe
            dist/*-Setup.exe.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  installer:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: blacktable-windows-x64-candidate
          path: dist
      - name: Verify the installer checksum
        run: |
          $setup = Get-ChildItem dist -Filter "*-Setup.exe"
          $expected = ((Get-Content "$($setup.FullName).sha256" -Raw).Trim() -split '\s+')[0]
          $actual = (Get-FileHash -LiteralPath $setup.FullName -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "Installer SHA-256 did not match the build artifact" }
      - name: Install, launch, test all split modes and uninstall
        run: |
          $setup = Get-ChildItem dist -Filter "*-Setup.exe"
          python windows/smoke.py --installer $setup.FullName --ai
      - name: Upload the tested, unsigned installer
        uses: actions/upload-artifact@v4
        with:
          name: Blacktable-Studio-Windows-x64
          path: |
            dist/*-Setup.exe
            dist/*-Setup.exe.sha256
          if-no-files-found: error
          compression-level: 0
